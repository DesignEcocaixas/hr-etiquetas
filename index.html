<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Visualizador de PDF</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* sem rolagem da página */
    }

    /* 🔹 Fundo ocupando toda a tela */
    body {
      background: url('bg.png') center center / cover no-repeat;
      background-color: #000; /* cor de fallback enquanto a imagem carrega */
    }

    /* 🔹 PDF ocupando toda a tela, sobre o fundo */
    iframe {
      position: fixed;
      inset: 0;           /* top:0; right:0; bottom:0; left:0 */
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Troque "meuarquivo.pdf" pelo nome do seu PDF -->
  <!--<iframe src="meuarquivo.pdf#zoom=page-width"></iframe>-->

</body>
</html>
