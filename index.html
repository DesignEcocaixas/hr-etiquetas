<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>HR Etiquetas — Interativo</title>
<style>
  :root{
    /* 🔼 Subimos os hotspots: diminuí o top de 72vh → 64vh */
    --email-x: 12vw;  --email-y: 64vh;  --email-w: 26vw;  --email-h: 14vh;
    --fone-x:  37vw;  --fone-y: 64vh;   --fone-w: 26vw;   --fone-h: 14vh;
    --zap-x:   62vw;  --zap-y:  64vh;   --zap-w: 26vw;    --zap-h:  14vh;

    --bg-url: url('bg.png');
  }

  html, body {
    margin: 0;
    height: 100%;
  }

  .bg {
    position: fixed;
    inset: 0;
    background: var(--bg-url) center center / cover no-repeat;
    z-index: -1;
  }

  .hotspot {
    position: fixed;
    display: block;
    background: rgba(0,0,0,0);
  }
  .hotspot:focus-visible {
    box-shadow: 0 0 0 3px rgba(255,255,255,.9), 0 0 0 6px rgba(0,173,239,.9);
    border-radius: 12px;
  }

  .hs-email { left: var(--email-x); top: var(--email-y); width: var(--email-w); height: var(--email-h); }
  .hs-fone  { left: var(--fone-x);  top: var(--fone-y);  width: var(--fone-w);  height: var(--fone-h); }
  .hs-zap   { left: var(--zap-x);   top: var(--zap-y);   width: var(--zap-w);   height: var(--zap-h); }
</style>
</head>
<body>

  <div class="bg" aria-hidden="true"></div>

  <a class="hotspot hs-email" href="mailto:contato@hretiquetas.com.br" aria-label="Enviar e-mail"></a>
  <a class="hotspot hs-fone"  href="tel:+5571999999999" aria-label="Ligar por telefone"></a>
  <a class="hotspot hs-zap"   href="https://wa.me/5571999999999?text=Olá!%20Vim%20pelo%20site." target="_blank" rel="noopener" aria-label="Chamar no WhatsApp"></a>

</body>
</html>
