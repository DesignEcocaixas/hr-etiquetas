<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Visualizador de PDF</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden; /* remove a barra de rolagem da página */
      background: #000; /* fundo preto para quando o PDF estiver carregando */
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <!-- Troque "meuarquivo.pdf" pelo nome do seu PDF -->
  <iframe src="meuarquivo.pdf"></iframe>

</body>
</html>
